<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>India temperature trends</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f5;--card:#fff;--ink:#16201f;--mute:#6c7776;--line:#e4e8e7;--acc:#3454d1;--accbg:#edf0fc;--warm:#c4452d;--r:18px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:28px 20px 40px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:14px}
.dash{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.left{display:flex;flex-direction:column;gap:16px;min-width:0}
.mapcard{flex:1;min-height:440px;position:relative}
#map{position:absolute;inset:0}
.side{display:flex;flex-direction:column}
.sec{padding:20px 22px;border-bottom:1px solid var(--line)}
.sec:last-child{border:0}
.sec h2{font-size:13px;font-weight:600;color:var(--mute);margin:0 0 12px}
.big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.big small{font-size:15px;font-weight:500;color:var(--mute);margin-left:6px;letter-spacing:0}
.big.up{color:var(--warm)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px}
.stats div{padding-right:10px}.stats div+div{padding-left:14px;border-left:1px solid var(--line)}
.stats b{display:block;font-size:17px;font-weight:600}.stats span{font-size:12.5px;color:var(--mute)}
.gist{margin:0;color:#2c3837}
.arts{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.arts a{color:var(--ink);text-decoration:none;font-weight:500;display:block}
.arts a:hover{color:var(--acc)}.arts small{color:var(--mute)}
.chartcard{grid-column:1/-1;padding:20px 22px}
.chartcard h2{font-size:13px;font-weight:600;color:var(--mute);margin:0 0 4px}
.chartcard .t{font-size:17px;font-weight:600;margin-bottom:10px}
#chart{position:relative;width:100%}
#chart svg{display:block;width:100%}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:4px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-130%);opacity:0}
/* time period selector */
.tps{padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
.seg{display:flex;background:var(--bg);padding:3px;border-radius:11px}
.seg button{border:0;background:none;font:500 13px Figtree,sans-serif;color:var(--mute);padding:7px 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.ctl{display:none;gap:8px;align-items:center;flex-wrap:wrap}.ctl.on{display:flex}
.ctl select{font:500 13px Figtree,sans-serif;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.ctl .to{color:var(--mute);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips label{cursor:pointer}.chips input{position:absolute;opacity:0}
.chips span{display:block;padding:5px 9px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;color:var(--mute)}
.chips input:checked+span{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.chips input:focus-visible+span{outline:2px solid var(--acc)}
.note{font-size:12px;color:var(--mute);margin-top:14px}
@media(max-width:900px){.dash{grid-template-columns:1fr}.mapcard{min-height:380px}}
</style></head>
<body><div class="wrap">
<header><div><h1>India temperature trends</h1><div class="sub" id="region">India</div></div>
<div class="sub">Click a state on the map to see its trend</div></header>
<div class="dash">
  <div class="left">
    <div class="card mapcard"><div id="map"></div></div>
    <div class="card tps" id="tps"></div>
  </div>
  <aside class="card side">
    <section class="sec"><h2>Summary</h2>
      <div class="big" id="change">–</div>
      <div class="stats">
        <div><b id="pv">–</b><span>p-value</span></div>
        <div><b id="sl">–</b><span id="slu">Slope</span></div>
        <div><b id="ic">–</b><span>Intercept</span></div>
      </div></section>
    <section class="sec"><h2>Gist</h2><p class="gist" id="gist"></p></section>
    <section class="sec"><h2>Related articles</h2><ul class="arts" id="arts"></ul></section>
  </aside>
  <section class="card chartcard"><h2 id="ctitle">Trend</h2><div class="t" id="csub"></div><div id="chart"></div>
    <div class="note">Demo data: generated from a seeded model so the dashboard works end to end. Replace <code>getSeries()</code> in dashboard.js with your real temperature data.</div></section>
</div></div>
<script src="leaflet.js"></script>
<script src="map.js"></script>
<script src="dashboard.js"></script>
</body></html>
